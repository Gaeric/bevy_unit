[package]
name = "hs2_head"
version = "0.1.1"
edition = "2024"

# `cargo run -p hs2_head --features dlss -- --raytracing --dlss`.

[dependencies]
bevy = { version = "0.20.0", features = [
        "wayland",
        "dynamic_linking",
        "hotpatching",
        "asset_processor",
        "file_watcher",
        "bevy_feathers",
        "free_camera",
        "dds",
        "bevy_solari",
] }
clap = { version = "4.0", features = ["derive"] }
crossbeam-channel = "0.5.0"

[features]
default = ["dev"]
dev = [
        "bevy/dynamic_linking",
        "bevy/bevy_dev_tools",
        "bevy/bevy_ui_debug",
        "bevy/bevy_solari",
]
dlss = ["bevy/dlss"]
