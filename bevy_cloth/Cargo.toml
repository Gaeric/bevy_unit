[package]
name = "bevy_cloth"
version = "0.1.0"
edition = "2024"

[dependencies]
# fps overlay in the examples; `fps_overlay` is behind bevy_dev_tools' `render` feature in 0.20
bevy = { version = "0.20.0", features = [
        "bevy_dev_tools",
        "render_dev_tools",
        "jpeg",
        "bevy_feathers",
] }
# same version bevy_math use
glam = "0.33"
rand = "0.10.0"
bytemuck = { version = "1", features = ["derive"] }
# Timestamp query types match the locally patched Bevy renderer; no extra backend features.
wgpu = { version = "30", default-features = false }
