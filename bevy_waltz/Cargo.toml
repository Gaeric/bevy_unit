[package]
name = "bevy_waltz"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", features = [
        "wayland",
        "dynamic_linking",
        "hotpatching",
] }

# physic engine
avian3d = { version = "0.7.0", features = ["diagnostic_ui"] }

# character system
bevy-tnua = "0.32.0"
bevy-tnua-avian3d = "0.12.0"

# control system
bevy_enhanced_input = "0.26"

# develop ui toolkit
bevy_perf_ui = "0.7.0"

#
serde = { version = "1", features = ["derive"] }

# bone attachments
bone_attachments = { path = "../units/bone_attachments" }

bevy_mod_outline = { git = "https://github.com/komadori/bevy_mod_outline", branch = "master" }

